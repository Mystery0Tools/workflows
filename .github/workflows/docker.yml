name: Build & Push Docker Image
on:
  workflow_call:
    inputs:
      docker-image-tag:
        required: true
        type: string
    secrets:
      REGISTRY_URL:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Download Output Files
        uses: actions/download-artifact@v4
        with:
          name: build-outputs-docker
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ inputs.docker-image-tag }}
          no-cache: true
      - name: Trigger image sync
        id: image_sync
        env:
          IMAGE_SYNC_URL: ${{ secrets.IMAGE_SYNC_URL }}
          IMAGE_SYNC_TOKEN: ${{ secrets.IMAGE_SYNC_TOKEN }}
          IMAGE_NAME: ${{ inputs.docker-image-tag }}
        run: |
          set -euo pipefail

          response="$(curl -fsS -X POST "${IMAGE_SYNC_URL}/api/sync" \
            -H "Authorization: Bearer ${IMAGE_SYNC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE_NAME}\"}")"

          echo "${response}"

          task_id="$(echo "${response}" | jq -r '.taskId')"
          if [ -z "${task_id}" ] || [ "${task_id}" = "null" ]; then
            echo "Failed to read taskId from image-sync response" >&2
            exit 1
          fi

          echo "task_id=${task_id}" >> "${GITHUB_OUTPUT}"
      - name: Wait image sync
        env:
          IMAGE_SYNC_URL: ${{ secrets.IMAGE_SYNC_URL }}
          IMAGE_SYNC_TOKEN: ${{ secrets.IMAGE_SYNC_TOKEN }}
          TASK_ID: ${{ steps.image_sync.outputs.task_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 90); do
            response="$(curl -fsS "${IMAGE_SYNC_URL}/api/sync/${TASK_ID}/done" \
              -H "Authorization: Bearer ${IMAGE_SYNC_TOKEN}")"

            echo "${response}"

            done="$(echo "${response}" | jq -r '.done')"
            success="$(echo "${response}" | jq -r '.success')"
            status="$(echo "${response}" | jq -r '.status')"

            if [ "${done}" = "true" ]; then
              if [ "${success}" = "true" ]; then
                echo "Image sync succeeded"
                exit 0
              fi

              echo "Image sync failed with status: ${status}" >&2
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for image sync" >&2
          exit 1
      - uses: geekyeggo/delete-artifact@v4
        with:
          name: build-outputs-docker